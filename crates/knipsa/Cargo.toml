[package]
name = "knipsa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Polygon booleans, offsets, point queries, and triangulation in Rust"
publish = ["crates-io"]
readme = "../../README.md"
documentation = "https://docs.rs/knipsa"
keywords = ["geometry", "polygon", "clipping", "offsetting"]
categories = ["algorithms", "graphics", "mathematics"]

[dependencies]
earcutr = "0.5.0"
geo-types = { version = "0.7.20", optional = true, default-features = false }
num-bigint = "0.4.6"
num-traits = "0.2.19"
serde = { version = "1.0.219", optional = true, features = ["derive"] }

[features]
default = []
geo-types = ["dep:geo-types"]
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[[bench]]
name = "workload"
harness = false

[[bench]]
name = "open_workload"
harness = false

[[bench]]
name = "offset_workload"
harness = false

[[bench]]
name = "triangulation_workload"
harness = false

[[bench]]
name = "triangulation_d_workload"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
