name: Validate production adaptive fusion

on:
  push:
    branches: [agent/adaptive-orthogonal-boundary-fusion]

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build benchmark matrix
        run: |
          node <<'NODE'
          const fs = require("fs");
          const rectangle = (x, y, width = 2, height = 2) => [
            [x, y],
            [x + width, y],
            [x + width, y + height],
            [x, y + height],
          ];

          const sparseCount = 192;
          const sparseSubjects = Array.from({ length: sparseCount }, (_, index) =>
            rectangle(index * 4, ((index * 73) % sparseCount) * 4),
          );
          const sparseClips = Array.from({ length: sparseCount }, (_, index) =>
            rectangle(index * 4 + 1, ((index * 109) % sparseCount) * 4 + 1),
          );

          const checkerSubjects = [];
          const checkerClips = [];
          for (let y = 0; y < 20; y += 1) {
            for (let x = 0; x < 20; x += 1) {
              const target = ((x + y) & 1) === 0 ? checkerSubjects : checkerClips;
              target.push(rectangle(x * 3, y * 3));
            }
          }

          const nestedSubjects = [];
          const nestedClips = [];
          for (let index = 0; index < 64; index += 1) {
            const inset = index * 2;
            const size = 520 - inset * 2;
            nestedSubjects.push(rectangle(inset, inset, size, size));
            nestedClips.push(rectangle(inset + 1, inset + 1, size, size));
          }

          const testCase = (id, subjects, clips) => ({
            id,
            clip_type: "xor",
            fill_rule: "even_odd",
            subjects,
            clips,
          });
          fs.writeFileSync("/tmp/orthogonal-workloads.json", JSON.stringify({
            schema: "knipsa-workload-v1",
            cases: [
              testCase("orthogonal_sparse_384", sparseSubjects, sparseClips),
              testCase("orthogonal_checker_400", checkerSubjects, checkerClips),
              testCase("orthogonal_nested_128", nestedSubjects, nestedClips),
            ],
          }));
          NODE

      - name: Build main baseline
        run: |
          git worktree add /tmp/knipsa-main 6de64b73f735edbb89d15a7b82740d5651b20405
          cd /tmp/knipsa-main
          CARGO_TARGET_DIR=/tmp/baseline-target cargo +stable build --release -p knipsa --bench workload
          baseline_bin=$(find /tmp/baseline-target/release/deps -type f -perm -111 -name 'workload-*' | head -n 1)
          test -n "$baseline_bin"
          cp "$baseline_bin" /tmp/workload-before

      - name: Build optimized branch
        run: |
          CARGO_TARGET_DIR=/tmp/optimized-target cargo +stable build --release -p knipsa --bench workload
          optimized_bin=$(find /tmp/optimized-target/release/deps -type f -perm -111 -name 'workload-*' | head -n 1)
          test -n "$optimized_bin"
          cp "$optimized_bin" /tmp/workload-after

      - name: Compare alternating runs
        run: |
          : > /tmp/before.jsonl
          : > /tmp/after.jsonl
          for run in 1 2 3 4 5 6 7 8 9; do
            KNIPSA_WORKLOAD=/tmp/orthogonal-workloads.json /tmp/workload-before >> /tmp/before.jsonl
            KNIPSA_WORKLOAD=/tmp/orthogonal-workloads.json /tmp/workload-after >> /tmp/after.jsonl
          done
          node <<'NODE'
          const fs = require("fs");
          const parse = path => fs.readFileSync(path, "utf8").trim().split("\n")
            .map(line => JSON.parse(line)).filter(row => row.id);
          const group = rows => rows.reduce((map, row) => {
            if (!map.has(row.id)) map.set(row.id, []);
            map.get(row.id).push(row);
            return map;
          }, new Map());
          const median = values => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          const before = group(parse("/tmp/before.jsonl"));
          const after = group(parse("/tmp/after.jsonl"));
          let beforeTotal = 0;
          let afterTotal = 0;
          const regressions = [];
          for (const [id, beforeRows] of before) {
            const afterRows = after.get(id);
            if (!afterRows || beforeRows[0].signature !== afterRows[0].signature) {
              throw new Error(`output mismatch: ${id}`);
            }
            const baseline = median(beforeRows.map(row => Number(row.median_ns)));
            const optimized = median(afterRows.map(row => Number(row.median_ns)));
            const ratio = baseline / optimized;
            console.log(`${id}: ${baseline} ns -> ${optimized} ns (${ratio.toFixed(4)}x)`);
            if (optimized > baseline * 1.03) regressions.push(id);
            beforeTotal += baseline;
            afterTotal += optimized;
          }
          const aggregate = beforeTotal / afterTotal;
          console.log(`aggregate: ${beforeTotal} ns -> ${afterTotal} ns (${aggregate.toFixed(4)}x)`);
          if (regressions.length) throw new Error(`regressions above 3%: ${regressions.join(", ")}`);
          if (aggregate < 1.20) throw new Error(`aggregate speedup below 1.20x: ${aggregate}`);
          NODE

      - name: Validate stable workspace
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --all-features
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps
          RUSTUP_TOOLCHAIN=stable ./scripts/check-c-api.sh

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Validate full coverage
        run: ./scripts/coverage.sh

      - name: Remove validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-validate-adaptive-fusion.yml
          git commit -m "Remove adaptive fusion validation workflow"
          git push origin HEAD:agent/adaptive-orthogonal-boundary-fusion
