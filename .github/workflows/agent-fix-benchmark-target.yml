name: Agent fix benchmark target

on:
  push:
    branches: [agent/fuse-orthogonal-column-sweep]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolate stable benchmark target
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = ".github/workflows/agent-fused-sweep.yml";
          let source = fs.readFileSync(path, "utf8");
          source = source.replaceAll(
            "cargo build --release -p knipsa --bench workload",
            "CARGO_TARGET_DIR=/tmp/bench-target cargo +stable build --release -p knipsa --bench workload",
          );
          source = source.replaceAll(
            "find target/release/deps",
            "find /tmp/bench-target/release/deps",
          );
          source = source.replace("cargo fmt --all -- --check", "cargo +stable fmt --all -- --check");
          source = source.replace("cargo test --workspace --all-features", "cargo +stable test --workspace --all-features");
          source = source.replace(
            "cargo clippy --workspace --all-targets --all-features -- -D warnings",
            "cargo +stable clippy --workspace --all-targets --all-features -- -D warnings",
          );
          source = source.replace(
            "RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --all-features --no-deps",
            "RUSTDOCFLAGS=\"-D warnings\" cargo +stable doc --workspace --all-features --no-deps",
          );
          source = source.replace(
            "./scripts/check-c-api.sh",
            "RUSTUP_TOOLCHAIN=stable ./scripts/check-c-api.sh",
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Commit workflow fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-fix-benchmark-target.yml
          git add .github/workflows/agent-fused-sweep.yml
          git commit -m "Fix fused sweep benchmark target"
          git push origin HEAD:agent/fuse-orthogonal-column-sweep
