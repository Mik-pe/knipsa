name: Agent fused orthogonal sweep v5

on:
  push:
    branches: [agent/fuse-orthogonal-column-sweep]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Extract experiment steps from history
        run: |
          git show 0f19343bf8a9f1952b93b7c8c6df5b52e80d695e:.github/workflows/agent-fused-sweep-v2.yml > /tmp/experiment.yml
          cat > /tmp/extract-step.js <<'NODE'
          const fs = require("fs");
          const name = process.argv[2];
          const source = fs.readFileSync("/tmp/experiment.yml", "utf8");
          const marker = `      - name: ${name}\n        run: |\n`;
          const start = source.indexOf(marker);
          if (start < 0) throw new Error(`missing step: ${name}`);
          const rest = source.slice(start + marker.length).split("\n");
          const body = [];
          for (const line of rest) {
            if (line.startsWith("      - ")) break;
            body.push(line.startsWith("          ") ? line.slice(10) : line);
          }
          process.stdout.write(body.join("\n"));
          NODE

      - name: Build orthogonal benchmark matrix
        run: node /tmp/extract-step.js "Build orthogonal benchmark matrix" | bash

      - name: Build baseline benchmark
        run: node /tmp/extract-step.js "Build baseline benchmark" | sed 's/ -maxdepth 1//g' | bash

      - name: Fuse column evaluation and boundary emission
        run: |
          node /tmp/extract-step.js "Fuse column evaluation and boundary emission" \
            | sed 's/#\[derive(Clone, Copy, Debug)\]/#[derive(Clone, Copy)]/' \
            | bash

      - name: Build optimized benchmark
        run: node /tmp/extract-step.js "Build optimized benchmark" | sed 's/ -maxdepth 1//g' | bash

      - name: Compare alternating benchmark runs
        run: node /tmp/extract-step.js "Compare alternating benchmark runs" | bash

      - name: Validate Rust workspace
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --all-features
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps

      - name: Commit optimized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-fused-sweep-v5.yml
          git add crates/knipsa/src/fast.rs
          git commit -m "Fuse orthogonal column sweep"
          git push origin HEAD:agent/fuse-orthogonal-column-sweep
