name: Format adaptive fusion source

on:
  push:
    branches: [agent/adaptive-orthogonal-boundary-fusion]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-format-adaptive-fusion.yml
          git add crates/knipsa/src/fast_dispatch.rs crates/knipsa/src/lib.rs
          git commit -m "Format adaptive fusion source"
          git push origin HEAD:agent/adaptive-orthogonal-boundary-fusion
