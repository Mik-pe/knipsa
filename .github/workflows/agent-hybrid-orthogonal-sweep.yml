name: Agent hybrid orthogonal sweep

on:
  push:
    branches: [agent/fuse-orthogonal-column-sweep]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Extract benchmark setup from history
        run: |
          git show 0f19343bf8a9f1952b93b7c8c6df5b52e80d695e:.github/workflows/agent-fused-sweep-v2.yml > /tmp/experiment.yml
          cat > /tmp/extract-step.js <<'NODE'
          const fs = require("fs");
          const name = process.argv[2];
          const source = fs.readFileSync("/tmp/experiment.yml", "utf8");
          const marker = `      - name: ${name}\n        run: |\n`;
          const start = source.indexOf(marker);
          if (start < 0) throw new Error(`missing step: ${name}`);
          const rest = source.slice(start + marker.length).split("\n");
          const body = [];
          for (const line of rest) {
            if (line.startsWith("      - ")) break;
            body.push(line.startsWith("          ") ? line.slice(10) : line);
          }
          process.stdout.write(body.join("\n"));
          NODE

      - name: Build orthogonal benchmark matrix
        run: node /tmp/extract-step.js "Build orthogonal benchmark matrix" | bash

      - name: Build baseline benchmark
        run: node /tmp/extract-step.js "Build baseline benchmark" | sed 's/ -maxdepth 1//g' | bash

      - name: Add adaptive fused sweep
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "crates/knipsa/src/fast.rs";
          let source = fs.readFileSync(path, "utf8");

          const eventBlock = `#[derive(Clone, Copy, Debug)]
          struct GridEvent {
              x: usize,
              y0: usize,
              y1: usize,
              subject_delta: i32,
              clip_delta: i32,
          }
          `;
          const eventReplacement = `${eventBlock}
          #[derive(Clone, Copy, Debug, Default)]
          struct HorizontalSpanStats {
              edge_count: usize,
              total_key_span: u128,
          }

          impl HorizontalSpanStats {
              fn record(&mut self, start: PointKey, end: PointKey) {
                  self.edge_count += 1;
                  self.total_key_span += u128::from(start.x.abs_diff(end.x));
              }

              fn should_fuse(&self, xs: &[GridCoordinate]) -> bool {
                  let Some((first, last)) = xs.first().zip(xs.last()) else {
                      return false;
                  };
                  if self.edge_count == 0 {
                      return false;
                  }
                  let coordinate_span = u128::from(first.key.abs_diff(last.key));
                  let intervals = u128::try_from(xs.len() - 1).expect("grid interval count fits u128");
                  let edge_count = u128::try_from(self.edge_count).expect("edge count fits u128");
                  self.total_key_span.saturating_mul(intervals)
                      >= coordinate_span.saturating_mul(edge_count).saturating_mul(8)
              }
          }
          `;
          if (!source.includes(eventBlock)) throw new Error("GridEvent block not found");
          source = source.replace(eventBlock, eventReplacement);

          const buildBlock = `    let mut events = Vec::with_capacity(edge_count / 2);
              let mut difference = vec![WindingDifference::default(); height];
              for path in &subjects {
                  add_orthogonal_path(&mut events, &mut difference, &xs, &ys, path.points(), true)?;
              }
              for path in &clips {
                  add_orthogonal_path(&mut events, &mut difference, &xs, &ys, path.points(), false)?;
              }
              events.sort_unstable_by_key(|event| event.x);

              let rows = height - 1;
          `;
          const buildReplacement = `    let mut events = Vec::with_capacity(edge_count / 2);
              let mut difference = vec![WindingDifference::default(); height];
              let mut horizontal_spans = HorizontalSpanStats::default();
              for path in &subjects {
                  add_orthogonal_path(
                      &mut events,
                      &mut difference,
                      &mut horizontal_spans,
                      &xs,
                      &ys,
                      path.points(),
                      true,
                  )?;
              }
              for path in &clips {
                  add_orthogonal_path(
                      &mut events,
                      &mut difference,
                      &mut horizontal_spans,
                      &xs,
                      &ys,
                      path.points(),
                      false,
                  )?;
              }
              events.sort_unstable_by_key(|event| event.x);
              if horizontal_spans.should_fuse(&xs) {
                  return Some(fused_orthogonal_sweep(
                      &events,
                      difference,
                      &xs,
                      &ys,
                      request.fill_rule,
                      request.clip_type,
                      edge_count,
                      grid_size,
                  ));
              }

              let rows = height - 1;
          `;
          if (!source.includes(buildBlock)) throw new Error("arrangement build block not found");
          source = source.replace(buildBlock, buildReplacement);

          const signature = `fn add_orthogonal_path(
              events: &mut Vec<GridEvent>,
              difference: &mut [WindingDifference],
              xs: &[GridCoordinate],
          `;
          const signatureReplacement = `fn add_orthogonal_path(
              events: &mut Vec<GridEvent>,
              difference: &mut [WindingDifference],
              horizontal_spans: &mut HorizontalSpanStats,
              xs: &[GridCoordinate],
          `;
          if (!source.includes(signature)) throw new Error("add_orthogonal_path signature not found");
          source = source.replace(signature, signatureReplacement);
          source = source.replace(
            `        if start_key.x != end_key.x {
                      continue;
                  }
          `,
            `        if start_key.x != end_key.x {
                      horizontal_spans.record(start_key, end_key);
                      continue;
                  }
          `,
          );

          const fillMarker = "fn fill_orthogonal_column(\n";
          const fillIndex = source.indexOf(fillMarker);
          if (fillIndex < 0) throw new Error("fill marker not found");
          const fusedHelpers = `#[derive(Clone, Copy)]
          struct HorizontalRun {
              start: GridCoordinate,
              direction: i8,
          }

          #[allow(clippy::too_many_arguments)]
          fn fused_orthogonal_sweep(
              events: &[GridEvent],
              mut difference: Vec<WindingDifference>,
              xs: &[GridCoordinate],
              ys: &[GridCoordinate],
              fill_rule: FillRule,
              clip_type: ClipType,
              edge_count: usize,
              grid_size: usize,
          ) -> Result<PathsD, Error> {
              let mut filled = vec![false; ys.len() - 1];
              let mut horizontal_runs = vec![None; ys.len()];
              let mut event_index = 0;
              let mut boundary = Vec::with_capacity(edge_count.saturating_mul(2).min(grid_size));
              for (x, coordinate) in xs.iter().copied().enumerate().take(xs.len() - 1) {
                  while event_index < events.len() && events[event_index].x == x {
                      let event = events[event_index];
                      add_winding_range(
                          &mut difference,
                          event.y0,
                          event.y1,
                          -event.subject_delta,
                          -event.clip_delta,
                      );
                      event_index += 1;
                  }
                  sweep_orthogonal_column(
                      &difference,
                      &mut filled,
                      fill_rule,
                      clip_type,
                      coordinate,
                      ys,
                      &mut horizontal_runs,
                      &mut boundary,
                  );
              }
              let right = *xs.last().expect("orthogonal grid has at least two columns");
              for (y, is_filled) in filled.iter().copied().enumerate() {
                  if is_filled {
                      push_grid_edge(&mut boundary, right, ys[y], right, ys[y + 1]);
                  }
              }
              flush_horizontal_runs(&mut boundary, &mut horizontal_runs, right, ys);
              finish_orthogonal_boundary(&boundary)
          }

          #[allow(clippy::too_many_arguments)]
          fn sweep_orthogonal_column(
              difference: &[WindingDifference],
              filled: &mut [bool],
              fill_rule: FillRule,
              clip_type: ClipType,
              x: GridCoordinate,
              ys: &[GridCoordinate],
              horizontal_runs: &mut [Option<HorizontalRun>],
              boundary: &mut Vec<DirectedEdge>,
          ) {
              match fill_rule {
                  FillRule::EvenOdd => sweep_orthogonal_column_with(
                      difference,
                      filled,
                      clip_type,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      |winding| (winding & 1) != 0,
                  ),
                  FillRule::NonZero => sweep_orthogonal_column_with(
                      difference,
                      filled,
                      clip_type,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      |winding| winding != 0,
                  ),
                  FillRule::Positive => sweep_orthogonal_column_with(
                      difference,
                      filled,
                      clip_type,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      |winding| winding > 0,
                  ),
                  FillRule::Negative => sweep_orthogonal_column_with(
                      difference,
                      filled,
                      clip_type,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      |winding| winding < 0,
                  ),
              }
          }

          #[inline]
          #[allow(clippy::too_many_arguments)]
          fn sweep_orthogonal_column_with(
              difference: &[WindingDifference],
              filled: &mut [bool],
              clip_type: ClipType,
              x: GridCoordinate,
              ys: &[GridCoordinate],
              horizontal_runs: &mut [Option<HorizontalRun>],
              boundary: &mut Vec<DirectedEdge>,
              contains: impl Fn(i32) -> bool,
          ) {
              match clip_type {
                  ClipType::Intersection => sweep_orthogonal_cells(
                      difference,
                      filled,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      &contains,
                      |subject, clip| subject && clip,
                  ),
                  ClipType::Union => sweep_orthogonal_cells(
                      difference,
                      filled,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      &contains,
                      |subject, clip| subject || clip,
                  ),
                  ClipType::Difference => sweep_orthogonal_cells(
                      difference,
                      filled,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      &contains,
                      |subject, clip| subject && !clip,
                  ),
                  ClipType::Xor => sweep_orthogonal_cells(
                      difference,
                      filled,
                      x,
                      ys,
                      horizontal_runs,
                      boundary,
                      &contains,
                      |subject, clip| subject != clip,
                  ),
              }
          }

          #[inline]
          #[allow(clippy::too_many_arguments)]
          fn sweep_orthogonal_cells(
              difference: &[WindingDifference],
              filled: &mut [bool],
              x: GridCoordinate,
              ys: &[GridCoordinate],
              horizontal_runs: &mut [Option<HorizontalRun>],
              boundary: &mut Vec<DirectedEdge>,
              contains: &impl Fn(i32) -> bool,
              operation: impl Fn(bool, bool) -> bool,
          ) {
              let mut subject_winding = 0;
              let mut clip_winding = 0;
              let mut below = false;
              for (y, (delta, cell)) in difference.iter().zip(filled.iter_mut()).enumerate() {
                  subject_winding += delta.subject;
                  clip_winding += delta.clip;
                  let current = operation(contains(subject_winding), contains(clip_winding));
                  if *cell != current {
                      if current {
                          push_grid_edge(boundary, x, ys[y + 1], x, ys[y]);
                      } else {
                          push_grid_edge(boundary, x, ys[y], x, ys[y + 1]);
                      }
                  }
                  let direction = if y == 0 {
                      i8::from(current)
                  } else if below == current {
                      0
                  } else if current {
                      1
                  } else {
                      -1
                  };
                  update_horizontal_run(boundary, &mut horizontal_runs[y], direction, x, ys[y]);
                  *cell = current;
                  below = current;
              }
              let top = filled.len();
              update_horizontal_run(
                  boundary,
                  &mut horizontal_runs[top],
                  if below { -1 } else { 0 },
                  x,
                  ys[top],
              );
          }

          #[inline]
          fn update_horizontal_run(
              boundary: &mut Vec<DirectedEdge>,
              run: &mut Option<HorizontalRun>,
              direction: i8,
              x: GridCoordinate,
              y: GridCoordinate,
          ) {
              match *run {
                  Some(active) if active.direction == direction => return,
                  Some(active) => {
                      if active.direction > 0 {
                          push_grid_edge(boundary, active.start, y, x, y);
                      } else {
                          push_grid_edge(boundary, x, y, active.start, y);
                      }
                      *run = None;
                  }
                  None => {}
              }
              if direction != 0 {
                  *run = Some(HorizontalRun { start: x, direction });
              }
          }

          fn flush_horizontal_runs(
              boundary: &mut Vec<DirectedEdge>,
              horizontal_runs: &mut [Option<HorizontalRun>],
              x: GridCoordinate,
              ys: &[GridCoordinate],
          ) {
              for (run, y) in horizontal_runs.iter_mut().zip(ys.iter().copied()) {
                  update_horizontal_run(boundary, run, 0, x, y);
              }
          }

          `;
          source = source.slice(0, fillIndex) + fusedHelpers + source.slice(fillIndex);

          source += `
          #[cfg(test)]
          mod adaptive_orthogonal_sweep_tests {
              use super::*;

              fn coordinate(key: i64) -> GridCoordinate {
                  GridCoordinate { key, value: key as f64 }
              }

              #[test]
              fn selects_only_long_compressed_horizontal_spans() {
                  let xs = (0..=16).map(coordinate).collect::<Vec<_>>();
                  let mut short = HorizontalSpanStats::default();
                  short.record(PointKey { x: 0, y: 0 }, PointKey { x: 1, y: 0 });
                  assert!(!short.should_fuse(&xs));
                  let mut long = HorizontalSpanStats::default();
                  long.record(PointKey { x: 0, y: 0 }, PointKey { x: 16, y: 0 });
                  assert!(long.should_fuse(&xs));
                  assert!(!HorizontalSpanStats::default().should_fuse(&[]));
              }

              #[test]
              fn fused_column_matches_existing_column_for_every_rule_and_operation() {
                  let difference = [
                      WindingDifference { subject: 1, clip: 0 },
                      WindingDifference { subject: -3, clip: 1 },
                      WindingDifference { subject: 4, clip: -2 },
                      WindingDifference { subject: -1, clip: 3 },
                      WindingDifference { subject: 2, clip: -1 },
                      WindingDifference { subject: -3, clip: -1 },
                  ];
                  let ys = (0..difference.len())
                      .map(|value| coordinate(value as i64))
                      .collect::<Vec<_>>();
                  for fill_rule in [
                      FillRule::EvenOdd,
                      FillRule::NonZero,
                      FillRule::Positive,
                      FillRule::Negative,
                  ] {
                      for clip_type in [
                          ClipType::Intersection,
                          ClipType::Union,
                          ClipType::Difference,
                          ClipType::Xor,
                      ] {
                          let mut expected = vec![false; difference.len() - 1];
                          fill_orthogonal_column(&difference, &mut expected, fill_rule, clip_type);
                          let mut actual = vec![false; expected.len()];
                          let mut runs = vec![None; difference.len()];
                          let mut boundary = Vec::new();
                          sweep_orthogonal_column(
                              &difference,
                              &mut actual,
                              fill_rule,
                              clip_type,
                              coordinate(0),
                              &ys,
                              &mut runs,
                              &mut boundary,
                          );
                          assert_eq!(actual, expected);
                          flush_horizontal_runs(&mut boundary, &mut runs, coordinate(1), &ys);
                          assert!(runs.iter().all(Option::is_none));
                      }
                  }
              }

              #[test]
              fn long_nested_rectangles_take_the_fused_path_and_match_exact_area() {
                  let subjects = (0..10)
                      .map(|inset| {
                          let inset = f64::from(inset);
                          vec![
                              Point::new(inset, inset),
                              Point::new(40.0 - inset, inset),
                              Point::new(40.0 - inset, 40.0 - inset),
                              Point::new(inset, 40.0 - inset),
                          ]
                      })
                      .collect::<Vec<_>>();
                  let request = BooleanRequestD {
                      subjects: &subjects,
                      clips: &[],
                      clip_type: ClipType::Union,
                      fill_rule: FillRule::EvenOdd,
                  };
                  let fast = try_orthogonal_arrangement(request)
                      .expect("nested orthogonal input is eligible")
                      .expect("fused sweep closes");
                  let exact = crate::boolean::boolean_opd_exact(request).expect("exact oracle closes");
                  let fast_area = fast.iter().map(|path| area2(path).abs()).sum::<f64>();
                  let exact_area = exact.iter().map(|path| area2(path).abs()).sum::<f64>();
                  assert_eq!(fast.len(), exact.len());
                  assert!((fast_area - exact_area).abs() <= 1.0e-9);
              }
          }
          `;

          fs.writeFileSync(path, source);
          NODE
          cargo +stable fmt --all

      - name: Build optimized benchmark
        run: node /tmp/extract-step.js "Build optimized benchmark" | sed 's/ -maxdepth 1//g' | bash

      - name: Compare alternating benchmark runs
        run: |
          : > /tmp/before.jsonl
          : > /tmp/after.jsonl
          for run in 1 2 3 4 5 6 7 8 9; do
            KNIPSA_WORKLOAD=/tmp/orthogonal-workloads.json /tmp/workload-before >> /tmp/before.jsonl
            KNIPSA_WORKLOAD=/tmp/orthogonal-workloads.json /tmp/workload-after >> /tmp/after.jsonl
          done
          node <<'NODE'
          const fs = require("fs");
          const parse = path => fs.readFileSync(path, "utf8").trim().split("\n")
            .map(line => JSON.parse(line)).filter(row => row.id);
          const group = rows => rows.reduce((map, row) => {
            if (!map.has(row.id)) map.set(row.id, []);
            map.get(row.id).push(row);
            return map;
          }, new Map());
          const median = values => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          const before = group(parse("/tmp/before.jsonl"));
          const after = group(parse("/tmp/after.jsonl"));
          let beforeTotal = 0;
          let afterTotal = 0;
          const regressions = [];
          for (const [id, beforeRows] of before) {
            const afterRows = after.get(id);
            if (!afterRows || beforeRows[0].signature !== afterRows[0].signature) {
              throw new Error(`output mismatch: ${id}`);
            }
            const baseline = median(beforeRows.map(row => Number(row.median_ns)));
            const optimized = median(afterRows.map(row => Number(row.median_ns)));
            const ratio = baseline / optimized;
            console.log(`${id}: ${baseline} ns -> ${optimized} ns (${ratio.toFixed(4)}x)`);
            if (optimized > baseline * 1.03) regressions.push(id);
            beforeTotal += baseline;
            afterTotal += optimized;
          }
          const aggregate = beforeTotal / afterTotal;
          console.log(`aggregate: ${beforeTotal} ns -> ${afterTotal} ns (${aggregate.toFixed(4)}x)`);
          if (regressions.length) throw new Error(`regressions above 3%: ${regressions.join(", ")}`);
          if (aggregate < 1.20) throw new Error(`aggregate speedup below 1.20x: ${aggregate}`);
          NODE

      - name: Validate Rust workspace
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --all-features
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps

      - name: Commit optimized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-hybrid-orthogonal-sweep.yml
          git add crates/knipsa/src/fast.rs
          git commit -m "Adapt orthogonal boundary fusion"
          git push origin HEAD:agent/fuse-orthogonal-column-sweep
