name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string
      confirmation:
        description: Type publish to confirm the irreversible upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirmation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          test "$GITHUB_REF" = "refs/tags/v$RELEASE_VERSION"
          test "$(cargo pkgid -p knipsa)" = "path+file://$GITHUB_WORKSPACE/crates/knipsa#$RELEASE_VERSION"
      - name: Verify release artifacts
        run: make release-check
      - name: Publish core crate
        run: cargo publish --locked -p knipsa
      - name: Wait for core crate in the registry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if cargo info "knipsa@$RELEASE_VERSION" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "knipsa@$RELEASE_VERSION did not appear in the registry" >&2
          exit 1
      - name: Verify and publish FFI crate
        run: |
          cargo publish --dry-run --locked -p knipsa-ffi
          cargo publish --locked -p knipsa-ffi
