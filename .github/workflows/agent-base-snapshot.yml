name: Agent base snapshot

on:
  push:
    branches: [agent/certified-face-overlay-offset-forest]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pack main source
        run: tar --exclude=.git -czf /tmp/knipsa-main-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: knipsa-main-source
          path: /tmp/knipsa-main-source.tar.gz
          if-no-files-found: error
          retention-days: 1
