name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-plan:
    name: Decide verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test CI reuse boundaries
        run: node --test .github/scripts/ci-reuse.test.mjs
      - name: Check successful PR tree
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-reuse.mjs decide

  msrv:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    name: Rust 1.97 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  rust:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check -p knipsa --no-default-features
      - run: cargo check -p knipsa --no-default-features --features geo-types
      - run: cargo check -p knipsa --no-default-features --features serde
      - run: cargo test --workspace --all-features
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  reference-adapters:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    name: Pinned reference adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: target/reference/boost_1_91_0.tar.bz2
          key: boost-source-1.91.0-de5e6b0e4913
      - run: CARGO_TARGET_DIR=target/reference/geo-ci cargo check --locked --manifest-path benchmarks/reference/geo/Cargo.toml
      - run: ./benchmarks/reference/build-boost.sh
      - run: ./benchmarks/reference/build-clipper2.sh
      - run: ./benchmarks/reference/build-jts.sh
      - run: make conformance-integer
      - run: make conformance-open
      - run: make conformance-offset
      - run: make conformance-triangulation
      - run: make conformance-triangulation-d

  c-api:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    name: C-compatible FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/check-c-api.sh

  release-package:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    name: Packaged crate consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make release-check

  coverage:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: ./scripts/coverage.sh

  fuzz-replay:
    needs: verify-plan
    if: needs.verify-plan.outputs.needed == 'true'
    name: Deterministic fuzz replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: ./scripts/fuzz-replay.sh

  verified-tree:
    name: Record verified PR tree
    needs: [verify-plan, msrv, rust, reference-adapters, c-api, release-package, coverage, fuzz-replay]
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source tree
        run: node .github/scripts/ci-reuse.mjs record
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-tested-tree/receipt.json
          retention-days: 14
          if-no-files-found: error
