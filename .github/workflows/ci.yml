name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.97 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check -p knipsa --no-default-features
      - run: cargo check -p knipsa --no-default-features --features geo-types
      - run: cargo check -p knipsa --no-default-features --features serde
      - run: cargo test --workspace --all-features
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  reference-adapters:
    name: Pinned reference adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: target/reference/boost_1_91_0.tar.bz2
          key: boost-source-1.91.0-de5e6b0e4913
      - run: CARGO_TARGET_DIR=target/reference/geo-ci cargo check --locked --manifest-path benchmarks/reference/geo/Cargo.toml
      - run: ./benchmarks/reference/build-boost.sh
      - run: ./benchmarks/reference/build-clipper2.sh
      - run: ./benchmarks/reference/build-jts.sh
      - run: make conformance-integer
      - run: make conformance-open
      - run: make conformance-offset
      - run: make conformance-triangulation
      - run: make conformance-triangulation-d

  c-api:
    name: C-compatible FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/check-c-api.sh

  release-package:
    name: Packaged crate consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make release-check

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: ./scripts/coverage.sh

  fuzz-replay:
    name: Deterministic fuzz replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: ./scripts/fuzz-replay.sh
