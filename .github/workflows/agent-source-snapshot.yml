name: Agent source snapshot

on:
  push:
    branches: [agent/certified-face-overlay-offset-forest]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack exact branch source
        run: tar --exclude=.git -czf /tmp/knipsa-product-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: knipsa-product-source
          path: /tmp/knipsa-product-source.tar.gz
          if-no-files-found: error
          retention-days: 1
