name: Agent fused orthogonal sweep

on:
  push:
    branches: [agent/fuse-orthogonal-column-sweep]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Build orthogonal benchmark matrix
        run: |
          node <<'NODE'
          const fs = require("fs");
          const rectangle = (x, y, width = 2, height = 2) => [
            [x, y],
            [x + width, y],
            [x + width, y + height],
            [x, y + height],
          ];

          const sparseCount = 192;
          const sparseSubjects = Array.from({ length: sparseCount }, (_, index) =>
            rectangle(index * 4, ((index * 73) % sparseCount) * 4),
          );
          const sparseClips = Array.from({ length: sparseCount }, (_, index) =>
            rectangle(index * 4 + 1, ((index * 109) % sparseCount) * 4 + 1),
          );

          const checkerSubjects = [];
          const checkerClips = [];
          for (let y = 0; y < 20; y += 1) {
            for (let x = 0; x < 20; x += 1) {
              const target = ((x + y) & 1) === 0 ? checkerSubjects : checkerClips;
              target.push(rectangle(x * 3, y * 3));
            }
          }

          const nestedSubjects = [];
          const nestedClips = [];
          for (let index = 0; index < 64; index += 1) {
            const inset = index * 2;
            const size = 520 - inset * 2;
            nestedSubjects.push(rectangle(inset, inset, size, size));
            nestedClips.push(rectangle(inset + 1, inset + 1, size, size));
          }

          const testCase = (id, subjects, clips) => ({
            id,
            clip_type: "xor",
            fill_rule: "even_odd",
            subjects,
            clips,
          });

          fs.writeFileSync("/tmp/orthogonal-workloads.json", JSON.stringify({
            schema: "knipsa-workload-v1",
            cases: [
              testCase("orthogonal_sparse_384", sparseSubjects, sparseClips),
              testCase("orthogonal_checker_400", checkerSubjects, checkerClips),
              testCase("orthogonal_nested_128", nestedSubjects, nestedClips),
            ],
          }));
          NODE

      - name: Build baseline benchmark
        run: |
          cargo build --release -p knipsa --bench workload
          baseline_bin=$(find target/release/deps -maxdepth 1 -type f -perm -111 -name 'workload-*' | head -n 1)
          test -n "$baseline_bin"
          cp "$baseline_bin" /tmp/workload-before

      - name: Fuse column evaluation and boundary emission
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "crates/knipsa/src/fast.rs";
          let source = fs.readFileSync(path, "utf8");

          const arrangementStart = source.indexOf("fn try_orthogonal_arrangement(");
          const sweepStart = source.indexOf("    let rows = height - 1;", arrangementStart);
          const finishStatement = "    Some(finish_orthogonal_boundary(&boundary))";
          const sweepFinish = source.indexOf(finishStatement, sweepStart);
          const sweepEnd = source.indexOf("\n", sweepFinish) + 1;
          if (arrangementStart < 0 || sweepStart < 0 || sweepFinish < 0 || sweepEnd <= 0) {
            throw new Error("orthogonal arrangement sweep was not found");
          }

          const fusedSweep = `    let rows = height - 1;
              let mut filled = vec![false; rows];
              let mut horizontal_runs = vec![None; height];
              let mut event_index = 0;
              let mut boundary = Vec::with_capacity(edge_count.saturating_mul(2).min(grid_size));
              for x in 0..xs.len() - 1 {
                  while event_index < events.len() && events[event_index].x == x {
                      let event = events[event_index];
                      add_winding_range(
                          &mut difference,
                          event.y0,
                          event.y1,
                          -event.subject_delta,
                          -event.clip_delta,
                      );
                      event_index += 1;
                  }
                  sweep_orthogonal_column(
                      &difference,
                      &mut filled,
                      request.fill_rule,
                      request.clip_type,
                      xs[x],
                      &ys,
                      &mut horizontal_runs,
                      &mut boundary,
                  );
              }
              let right = *xs.last().expect("orthogonal grid has at least two columns");
              for (y, is_filled) in filled.iter().copied().enumerate() {
                  if is_filled {
                      push_grid_edge(&mut boundary, right, ys[y], right, ys[y + 1]);
                  }
              }
              flush_horizontal_runs(&mut boundary, &mut horizontal_runs, right, &ys);
              Some(finish_orthogonal_boundary(&boundary))
          `;
          source = source.slice(0, sweepStart) + fusedSweep + source.slice(sweepEnd);

          const fillStart = source.indexOf("fn fill_orthogonal_column(");
          const pushStart = source.indexOf("#[inline]\nfn push_grid_edge(", fillStart);
          if (fillStart < 0 || pushStart < 0) {
            throw new Error("orthogonal column helpers were not found");
          }

          const fusedHelpers = `#[derive(Clone, Copy, Debug)]
          struct HorizontalRun {
              start: GridCoordinate,
              direction: i8,
          }

          #[allow(clippy::too_many_arguments)]
          fn sweep_orthogonal_column(
              difference: &[WindingDifference],
              filled: &mut [bool],
              fill_rule: FillRule,
              clip_type: ClipType,
              x: GridCoordinate,
              ys: &[GridCoordinate],
              horizontal_runs: &mut [Option<HorizontalRun>],
              boundary: &mut Vec<DirectedEdge>,
          ) {
              match fill_rule {
                  FillRule::EvenOdd => {
                      sweep_orthogonal_column_with(
                          difference,
                          filled,
                          clip_type,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          |winding| (winding & 1) != 0,
                      );
                  }
                  FillRule::NonZero => {
                      sweep_orthogonal_column_with(
                          difference,
                          filled,
                          clip_type,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          |winding| winding != 0,
                      );
                  }
                  FillRule::Positive => {
                      sweep_orthogonal_column_with(
                          difference,
                          filled,
                          clip_type,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          |winding| winding > 0,
                      );
                  }
                  FillRule::Negative => {
                      sweep_orthogonal_column_with(
                          difference,
                          filled,
                          clip_type,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          |winding| winding < 0,
                      );
                  }
              }
          }

          #[inline]
          #[allow(clippy::too_many_arguments)]
          fn sweep_orthogonal_column_with(
              difference: &[WindingDifference],
              filled: &mut [bool],
              clip_type: ClipType,
              x: GridCoordinate,
              ys: &[GridCoordinate],
              horizontal_runs: &mut [Option<HorizontalRun>],
              boundary: &mut Vec<DirectedEdge>,
              contains: impl Fn(i32) -> bool,
          ) {
              match clip_type {
                  ClipType::Intersection => {
                      sweep_orthogonal_cells(
                          difference,
                          filled,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          &contains,
                          |subject, clip| subject && clip,
                      );
                  }
                  ClipType::Union => {
                      sweep_orthogonal_cells(
                          difference,
                          filled,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          &contains,
                          |subject, clip| subject || clip,
                      );
                  }
                  ClipType::Difference => {
                      sweep_orthogonal_cells(
                          difference,
                          filled,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          &contains,
                          |subject, clip| subject && !clip,
                      );
                  }
                  ClipType::Xor => {
                      sweep_orthogonal_cells(
                          difference,
                          filled,
                          x,
                          ys,
                          horizontal_runs,
                          boundary,
                          &contains,
                          |subject, clip| subject != clip,
                      );
                  }
              }
          }

          #[inline]
          #[allow(clippy::too_many_arguments)]
          fn sweep_orthogonal_cells(
              difference: &[WindingDifference],
              filled: &mut [bool],
              x: GridCoordinate,
              ys: &[GridCoordinate],
              horizontal_runs: &mut [Option<HorizontalRun>],
              boundary: &mut Vec<DirectedEdge>,
              contains: &impl Fn(i32) -> bool,
              operation: impl Fn(bool, bool) -> bool,
          ) {
              let mut subject_winding = 0;
              let mut clip_winding = 0;
              let mut below = false;
              for (y, (delta, cell)) in difference.iter().zip(filled.iter_mut()).enumerate() {
                  subject_winding += delta.subject;
                  clip_winding += delta.clip;
                  let current = operation(contains(subject_winding), contains(clip_winding));
                  if *cell != current {
                      if current {
                          push_grid_edge(boundary, x, ys[y + 1], x, ys[y]);
                      } else {
                          push_grid_edge(boundary, x, ys[y], x, ys[y + 1]);
                      }
                  }
                  let direction = if y == 0 {
                      if current { 1 } else { 0 }
                  } else if below == current {
                      0
                  } else if current {
                      1
                  } else {
                      -1
                  };
                  update_horizontal_run(
                      boundary,
                      &mut horizontal_runs[y],
                      direction,
                      x,
                      ys[y],
                  );
                  *cell = current;
                  below = current;
              }
              let top_direction = if below { -1 } else { 0 };
              let top = filled.len();
              update_horizontal_run(
                  boundary,
                  &mut horizontal_runs[top],
                  top_direction,
                  x,
                  ys[top],
              );
          }

          #[inline]
          fn update_horizontal_run(
              boundary: &mut Vec<DirectedEdge>,
              run: &mut Option<HorizontalRun>,
              direction: i8,
              x: GridCoordinate,
              y: GridCoordinate,
          ) {
              match *run {
                  Some(active) if active.direction == direction => return,
                  Some(active) => {
                      if active.direction > 0 {
                          push_grid_edge(boundary, active.start, y, x, y);
                      } else {
                          push_grid_edge(boundary, x, y, active.start, y);
                      }
                      *run = None;
                  }
                  None => {}
              }
              if direction != 0 {
                  *run = Some(HorizontalRun { start: x, direction });
              }
          }

          fn flush_horizontal_runs(
              boundary: &mut Vec<DirectedEdge>,
              horizontal_runs: &mut [Option<HorizontalRun>],
              x: GridCoordinate,
              ys: &[GridCoordinate],
          ) {
              for (run, y) in horizontal_runs.iter_mut().zip(ys.iter().copied()) {
                  update_horizontal_run(boundary, run, 0, x, y);
              }
          }

          `;
          source = source.slice(0, fillStart) + fusedHelpers + source.slice(pushStart);

          const testStart = source.indexOf("#[cfg(test)]\nmod orthogonal_column_dispatch_tests {");
          if (testStart < 0) {
            throw new Error("orthogonal dispatch regression module was not found");
          }
          const fusedTests = `#[cfg(test)]
          mod orthogonal_column_dispatch_tests {
              use super::*;

              fn reference_contains(winding: i32, fill_rule: FillRule) -> bool {
                  match fill_rule {
                      FillRule::EvenOdd => winding.rem_euclid(2) == 1,
                      FillRule::NonZero => winding != 0,
                      FillRule::Positive => winding > 0,
                      FillRule::Negative => winding < 0,
                  }
              }

              fn reference_operation(subject: bool, clip: bool, clip_type: ClipType) -> bool {
                  match clip_type {
                      ClipType::Intersection => subject && clip,
                      ClipType::Union => subject || clip,
                      ClipType::Difference => subject && !clip,
                      ClipType::Xor => subject != clip,
                  }
              }

              fn coordinate(key: i64) -> GridCoordinate {
                  GridCoordinate { key, value: key as f64 }
              }

              #[test]
              fn fused_sweep_matches_scalar_reference() {
                  let difference = [
                      WindingDifference { subject: 1, clip: 0 },
                      WindingDifference { subject: -3, clip: 1 },
                      WindingDifference { subject: 4, clip: -2 },
                      WindingDifference { subject: -1, clip: 3 },
                      WindingDifference { subject: 2, clip: -1 },
                      WindingDifference { subject: -3, clip: -1 },
                  ];
                  let ys = (0..difference.len()).map(coordinate).collect::<Vec<_>>();
                  let fill_rules = [
                      FillRule::EvenOdd,
                      FillRule::NonZero,
                      FillRule::Positive,
                      FillRule::Negative,
                  ];
                  let clip_types = [
                      ClipType::Intersection,
                      ClipType::Union,
                      ClipType::Difference,
                      ClipType::Xor,
                  ];

                  for fill_rule in fill_rules {
                      for clip_type in clip_types {
                          let mut expected = vec![false; difference.len() - 1];
                          let mut subject_winding = 0;
                          let mut clip_winding = 0;
                          for (delta, cell) in difference.iter().zip(expected.iter_mut()) {
                              subject_winding += delta.subject;
                              clip_winding += delta.clip;
                              *cell = reference_operation(
                                  reference_contains(subject_winding, fill_rule),
                                  reference_contains(clip_winding, fill_rule),
                                  clip_type,
                              );
                          }

                          let mut actual = vec![false; expected.len()];
                          let mut runs = vec![None; difference.len()];
                          let mut boundary = Vec::new();
                          sweep_orthogonal_column(
                              &difference,
                              &mut actual,
                              fill_rule,
                              clip_type,
                              coordinate(0),
                              &ys,
                              &mut runs,
                              &mut boundary,
                          );
                          assert_eq!(actual, expected, "{fill_rule:?} {clip_type:?}");
                          flush_horizontal_runs(
                              &mut boundary,
                              &mut runs,
                              coordinate(1),
                              &ys,
                          );
                          assert!(runs.iter().all(Option::is_none));
                      }
                  }
              }

              #[test]
              fn horizontal_runs_extend_flip_and_close() {
                  let y = coordinate(7);
                  let mut run = None;
                  let mut boundary = Vec::new();
                  update_horizontal_run(&mut boundary, &mut run, 1, coordinate(0), y);
                  update_horizontal_run(&mut boundary, &mut run, 1, coordinate(1), y);
                  assert!(boundary.is_empty());
                  update_horizontal_run(&mut boundary, &mut run, -1, coordinate(2), y);
                  update_horizontal_run(&mut boundary, &mut run, 0, coordinate(3), y);
                  update_horizontal_run(&mut boundary, &mut run, 0, coordinate(4), y);
                  assert!(run.is_none());
                  assert_eq!(boundary.len(), 2);
                  assert_eq!(boundary[0].start_key.x, 0);
                  assert_eq!(boundary[0].end_key.x, 2);
                  assert_eq!(boundary[1].start_key.x, 3);
                  assert_eq!(boundary[1].end_key.x, 2);
              }
          }
          `;
          source = source.slice(0, testStart) + fusedTests;
          fs.writeFileSync(path, source);
          NODE

          cargo fmt --all

      - name: Build optimized benchmark
        run: |
          cargo build --release -p knipsa --bench workload
          optimized_bin=$(find target/release/deps -maxdepth 1 -type f -perm -111 -name 'workload-*' -newer crates/knipsa/src/fast.rs | head -n 1)
          if [ -z "$optimized_bin" ]; then
            optimized_bin=$(find target/release/deps -maxdepth 1 -type f -perm -111 -name 'workload-*' | head -n 1)
          fi
          test -n "$optimized_bin"
          cp "$optimized_bin" /tmp/workload-after

      - name: Compare alternating benchmark runs
        run: |
          : > /tmp/before.jsonl
          : > /tmp/after.jsonl
          for run in 1 2 3 4 5 6 7; do
            KNIPSA_WORKLOAD=/tmp/orthogonal-workloads.json /tmp/workload-before >> /tmp/before.jsonl
            KNIPSA_WORKLOAD=/tmp/orthogonal-workloads.json /tmp/workload-after >> /tmp/after.jsonl
          done

          node <<'NODE'
          const fs = require("fs");
          const parse = path => fs.readFileSync(path, "utf8")
            .trim()
            .split("\n")
            .map(line => JSON.parse(line))
            .filter(row => row.id);
          const group = rows => {
            const result = new Map();
            for (const row of rows) {
              if (!result.has(row.id)) result.set(row.id, []);
              result.get(row.id).push(row);
            }
            return result;
          };
          const median = values => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          const before = group(parse("/tmp/before.jsonl"));
          const after = group(parse("/tmp/after.jsonl"));
          let beforeTotal = 0;
          let afterTotal = 0;
          for (const [id, beforeRows] of before) {
            const afterRows = after.get(id);
            if (!afterRows || afterRows.length !== beforeRows.length) throw new Error(`missing ${id}`);
            if (beforeRows[0].signature !== afterRows[0].signature) throw new Error(`signature mismatch: ${id}`);
            const baseline = median(beforeRows.map(row => Number(row.median_ns)));
            const optimized = median(afterRows.map(row => Number(row.median_ns)));
            const ratio = baseline / optimized;
            console.log(`${id}: ${baseline} ns -> ${optimized} ns (${ratio.toFixed(4)}x)`);
            if (optimized > baseline * 1.05) throw new Error(`regression above 5%: ${id}`);
            beforeTotal += baseline;
            afterTotal += optimized;
          }
          const aggregate = beforeTotal / afterTotal;
          console.log(`aggregate: ${beforeTotal} ns -> ${afterTotal} ns (${aggregate.toFixed(4)}x)`);
          if (aggregate < 1.08) throw new Error(`aggregate speedup below 1.08x: ${aggregate}`);
          NODE

      - name: Validate workspace
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
          ./scripts/check-c-api.sh
          ./scripts/coverage.sh

      - name: Commit optimized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-fused-sweep.yml
          git add crates/knipsa/src/fast.rs
          git commit -m "Fuse orthogonal column sweep"
          git push origin HEAD:agent/fuse-orthogonal-column-sweep
