name: Agent hybrid orthogonal sweep v2

on:
  push:
    branches: [agent/fuse-orthogonal-column-sweep]

permissions:
  contents: write

jobs:
  optimize:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Extract hybrid experiment from history
        run: |
          git show 3fcb38d2ce3208ce678d08c298b723dbb18b5f82:.github/workflows/agent-hybrid-orthogonal-sweep.yml > /tmp/hybrid.yml
          cat > /tmp/extract-step.js <<'NODE'
          const fs = require("fs");
          const name = process.argv[2];
          const source = fs.readFileSync("/tmp/hybrid.yml", "utf8");
          const marker = `      - name: ${name}\n        run: |\n`;
          const start = source.indexOf(marker);
          if (start < 0) throw new Error(`missing step: ${name}`);
          const rest = source.slice(start + marker.length).split("\n");
          const body = [];
          for (const line of rest) {
            if (line.startsWith("      - ")) break;
            body.push(line.startsWith("          ") ? line.slice(10) : line);
          }
          process.stdout.write(body.join("\n"));
          NODE

      - name: Build orthogonal benchmark matrix
        run: node /tmp/extract-step.js "Build orthogonal benchmark matrix" | bash

      - name: Build baseline benchmark
        run: node /tmp/extract-step.js "Build baseline benchmark" | sed 's/ -maxdepth 1//g' | bash

      - name: Add lint-clean adaptive fused sweep
        run: |
          node /tmp/extract-step.js "Add adaptive fused sweep" \
            | sed \
                -e 's/fn coordinate(key: i64)/fn coordinate(key: i32)/' \
                -e 's/GridCoordinate { key, value: key as f64 }/GridCoordinate { key: i64::from(key), value: f64::from(key) }/' \
                -e 's/coordinate(value as i64)/coordinate(i32::try_from(value).expect("test row fits i32"))/' \
            | bash

      - name: Build optimized benchmark
        run: node /tmp/extract-step.js "Build optimized benchmark" | sed 's/ -maxdepth 1//g' | bash

      - name: Compare alternating benchmark runs
        run: node /tmp/extract-step.js "Compare alternating benchmark runs" | bash

      - name: Validate Rust workspace
        run: node /tmp/extract-step.js "Validate Rust workspace" | bash

      - name: Commit optimized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-hybrid-orthogonal-sweep-v2.yml
          git add crates/knipsa/src/fast.rs
          git commit -m "Adapt orthogonal boundary fusion"
          git push origin HEAD:agent/fuse-orthogonal-column-sweep
