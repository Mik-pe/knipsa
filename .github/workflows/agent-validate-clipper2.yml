name: Validate Knipsa against native Clipper2

on:
  push:
    branches: [agent/beat-clipper2-standard-matrix]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beat-clipper2-standard-matrix
          fetch-depth: 0

      - name: Detect active validation scaffold
        id: gate
        shell: bash
        run: |
          if [[ -f .github/workflows/agent-validate-clipper2.yml ]]; then
            echo active=true >> "$GITHUB_OUTPUT"
          else
            echo active=false >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.active == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.active == 'true'

      - name: Validate stable workspace
        if: steps.gate.outputs.active == 'true'
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable test --workspace --all-features
          cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo +stable doc --workspace --all-features --no-deps
          RUSTUP_TOOLCHAIN=stable ./scripts/check-c-api.sh

      - name: Build current-main baseline
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          git fetch origin main
          git worktree add --detach /tmp/knipsa-main origin/main
          cd /tmp/knipsa-main
          CARGO_TARGET_DIR=/tmp/knipsa-main-target cargo +stable build --release -p knipsa --bench workload
          baseline_bin=$(find /tmp/knipsa-main-target/release/deps -type f -name 'workload-*' ! -name '*.d' | while read -r candidate; do [[ -x "$candidate" ]] && echo "$candidate"; done | head -n 1)
          test -n "$baseline_bin"
          cp "$baseline_bin" /tmp/knipsa-workload-before

      - name: Build optimized candidate
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          CARGO_TARGET_DIR=/tmp/knipsa-candidate-target cargo +stable build --release -p knipsa --bench workload
          candidate_bin=$(find /tmp/knipsa-candidate-target/release/deps -type f -name 'workload-*' ! -name '*.d' | while read -r candidate; do [[ -x "$candidate" ]] && echo "$candidate"; done | head -n 1)
          test -n "$candidate_bin"
          cp "$candidate_bin" /tmp/knipsa-workload-after

      - name: Build pinned native Clipper2
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          clipper_bin=$(benchmarks/reference/build-clipper2.sh)
          cp "$clipper_bin" /tmp/knipsa-clipper2
          python3 benchmarks/reference/clipper2/encode-workload.py benchmarks/workloads.json > /tmp/knipsa-workload.bin

      - name: Run alternating benchmark matrix
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          : > /tmp/before.jsonl
          : > /tmp/after.jsonl
          : > /tmp/clipper2.jsonl
          for run in 1 2 3 4 5 6 7; do
            if (( run % 2 == 1 )); then
              KNIPSA_WORKLOAD="$GITHUB_WORKSPACE/benchmarks/workloads.json" /tmp/knipsa-workload-before >> /tmp/before.jsonl
              KNIPSA_WORKLOAD="$GITHUB_WORKSPACE/benchmarks/workloads.json" /tmp/knipsa-workload-after >> /tmp/after.jsonl
            else
              KNIPSA_WORKLOAD="$GITHUB_WORKSPACE/benchmarks/workloads.json" /tmp/knipsa-workload-after >> /tmp/after.jsonl
              KNIPSA_WORKLOAD="$GITHUB_WORKSPACE/benchmarks/workloads.json" /tmp/knipsa-workload-before >> /tmp/before.jsonl
            fi
            /tmp/knipsa-clipper2 < /tmp/knipsa-workload.bin >> /tmp/clipper2.jsonl
          done

      - name: Compare medians and enforce the win
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const parse = path => fs.readFileSync(path, 'utf8').trim().split('\n')
            .filter(Boolean).map(line => JSON.parse(line)).filter(row => row.id);
          const group = rows => rows.reduce((map, row) => {
            if (!map.has(row.id)) map.set(row.id, []);
            map.get(row.id).push(row);
            return map;
          }, new Map());
          const median = values => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          const before = group(parse('/tmp/before.jsonl'));
          const after = group(parse('/tmp/after.jsonl'));
          const clipper = group(parse('/tmp/clipper2.jsonl'));
          let beforeTotal = 0;
          let afterTotal = 0;
          let clipperTotal = 0;
          let wins = 0;
          let losses = 0;
          let ties = 0;
          const regressions = [];
          const speedups = new Map();
          const rows = [];
          for (const [id, beforeRows] of before) {
            const afterRows = after.get(id);
            const clipperRows = clipper.get(id);
            if (!afterRows || !clipperRows) throw new Error(`missing benchmark rows for ${id}`);
            const signature = beforeRows[0].signature;
            if (afterRows.some(row => row.signature !== signature)) {
              throw new Error(`candidate output mismatch for ${id}`);
            }
            if (clipperRows.some(row => row.signature !== signature)) {
              throw new Error(`Clipper2 output mismatch for ${id}`);
            }
            const baseline = median(beforeRows.map(row => Number(row.median_ns)));
            const optimized = median(afterRows.map(row => Number(row.median_ns)));
            const reference = median(clipperRows.map(row => Number(row.median_ns)));
            const speedup = baseline / optimized;
            const versusClipper = reference / optimized;
            speedups.set(id, speedup);
            if (optimized > baseline * 1.05) regressions.push(id);
            if (optimized < reference * 0.97) wins += 1;
            else if (reference < optimized * 0.97) losses += 1;
            else ties += 1;
            beforeTotal += baseline;
            afterTotal += optimized;
            clipperTotal += reference;
            rows.push({ id, baseline, optimized, reference, speedup, versusClipper });
          }
          const aggregateSpeedup = beforeTotal / afterTotal;
          const aggregateVersusClipper = clipperTotal / afterTotal;
          const lines = [
            '# Native Clipper2 benchmark evidence',
            '',
            '| Case | Main ns | Candidate ns | Clipper2 ns | Main / candidate | Clipper2 / candidate |',
            '| --- | ---: | ---: | ---: | ---: | ---: |',
            ...rows.map(row => `| ${row.id} | ${row.baseline} | ${row.optimized} | ${row.reference} | ${row.speedup.toFixed(3)}x | ${row.versusClipper.toFixed(3)}x |`),
            `| **Aggregate sum** | **${beforeTotal}** | **${afterTotal}** | **${clipperTotal}** | **${aggregateSpeedup.toFixed(3)}x** | **${aggregateVersusClipper.toFixed(3)}x** |`,
            '',
            `Score: Knipsa ${wins}, Clipper2 ${losses}, ties ${ties}.`,
          ];
          fs.writeFileSync('/tmp/benchmark.md', `${lines.join('\n')}\n`);
          console.log(lines.join('\n'));
          if (regressions.length) throw new Error(`candidate regressions above 5%: ${regressions.join(', ')}`);
          for (const id of ['high-vertex-intersection', 'high-vertex-xor']) {
            if ((speedups.get(id) ?? 0) < 2.0) throw new Error(`${id} speedup below 2x`);
          }
          if (aggregateSpeedup < 1.15) {
            throw new Error(`aggregate improvement below 1.15x: ${aggregateSpeedup.toFixed(4)}x`);
          }
          if (afterTotal >= clipperTotal * 0.98) {
            throw new Error(`candidate ${afterTotal} ns does not beat Clipper2 ${clipperTotal} ns by 2%`);
          }
          NODE

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.active == 'true'
        with:
          name: native-clipper2-benchmark
          path: |
            /tmp/before.jsonl
            /tmp/after.jsonl
            /tmp/clipper2.jsonl
            /tmp/benchmark.md

      - uses: dtolnay/rust-toolchain@nightly
        if: steps.gate.outputs.active == 'true'

      - uses: taiki-e/install-action@cargo-llvm-cov
        if: steps.gate.outputs.active == 'true'

      - name: Validate full coverage
        if: steps.gate.outputs.active == 'true'
        run: ./scripts/coverage.sh
