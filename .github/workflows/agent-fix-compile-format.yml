name: Fix compile regression and format

on:
  push:
    branches: [agent/certified-face-overlay-offset-forest]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed fix and format
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/old.txt <<'EOF'
                  let wedge_result = stitch_directed_edges(&wedge_boundary).expect("wedge boundary closes");
                  let wedge_oracle = stitch_directed_edges(&wedge_oracle).expect("wedge oracle closes");
          EOF
          cat > /tmp/new.txt <<'EOF'
                  let wedge_result = exact_paths_to_i64(
                      &stitch_directed_edges(&wedge_boundary).expect("wedge boundary closes"),
                  )
                  .expect("integer wedge result");
                  let wedge_oracle = exact_paths_to_i64(
                      &stitch_directed_edges(&wedge_oracle).expect("wedge oracle closes"),
                  )
                  .expect("integer wedge oracle");
          EOF
          sed -i 's/^          //' /tmp/old.txt /tmp/new.txt
          perl -0pi -e '
            BEGIN {
              local $/;
              open my $old_fh, "<", "/tmp/old.txt" or die $!;
              open my $new_fh, "<", "/tmp/new.txt" or die $!;
              $old = <$old_fh>;
              $new = <$new_fh>;
            }
            $count = s/\Q$old\E/$new/g;
            die "expected exactly one wedge test replacement, got $count\n" unless $count == 1;
          ' crates/knipsa/src/boolean.rs
          cargo fmt --all
          rm .github/workflows/agent-fix-compile-format.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix exact oracle test and format Rust sources'
          git push
