name: Apply final certified topology fixes

on:
  push:
    branches: [agent/certified-face-overlay-offset-forest]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply, format, and validate the reviewed source transformation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent/final-knipsa-fixes.mjs.gz.b64 | gzip --decompress > /tmp/final-knipsa-fixes.mjs
          node /tmp/final-knipsa-fixes.mjs
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-features
          python3 -m unittest scripts/test_compare_benchmark_results.py
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
          rm -rf .agent
          rm .github/workflows/agent-final-code-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete certified overlay and contour coverage'
          git push
